<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form - Share Your Feedback</title>
    <meta name="description" content="Submit your detailed product evaluation, rate performance and features, and share your user experience on our secure product review form.">
    <meta name="author" content="Sara Araujo">
    
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get">
            
            <!-- Product Name Dropdown -->
            <div class="form-group">
                <label for="product-name">Product Name</label>
                <select id="product-name" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <!-- Overall Rating Radio Buttons -->
            <div class="form-group">
                <span class="label-heading">Overall Rating</span>
                <div class="radio-group">
                    <div class="radio-item">
                        <label for="rating-1" class="radio-label"><span class="stars">&star;</span></label>
                        <input type="radio" id="rating-1" name="rating" value="1" required>
                    </div>
                    <div class="radio-item">
                        <label for="rating-2" class="radio-label"><span class="stars">&star;&star;</span></label>
                        <input type="radio" id="rating-2" name="rating" value="2" required>
                    </div>
                    <div class="radio-item">
                        <label for="rating-3" class="radio-label"><span class="stars">&star;&star;&star;</span></label>
                        <input type="radio" id="rating-3" name="rating" value="3" required>
                    </div>
                    <div class="radio-item">
                        <label for="rating-4" class="radio-label"><span class="stars">&star;&star;&star;&star;</span></label>
                        <input type="radio" id="rating-4" name="rating" value="4" required>
                    </div>
                    <div class="radio-item">
                        <label for="rating-5" class="radio-label"><span class="stars">&star;&star;&star;&star;&star;</span></label>
                        <input type="radio" id="rating-5" name="rating" value="5" required>
                    </div>
                </div>
            </div>

            <!-- Date of Installation -->
            <div class="form-group">
                <label for="installation-date">Date of Installation</label>
                <input type="date" id="installation-date" name="installationDate" required>
            </div>

            <!-- Useful Features Checkboxes -->
            <div class="form-group">
                <span class="label-heading">Which features did you find useful in the product? <br><small>(Check all that apply)</small></span>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature-durability" name="features" value="durability">
                        <label for="feature-durability">Durability</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature-ease" name="features" value="ease-of-use">
                        <label for="feature-ease">Ease of Use</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature-performance" name="features" value="performance">
                        <label for="feature-performance">Performance</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="feature-design" name="features" value="design">
                        <label for="feature-design">Design</label>
                    </div>
                </div>
            </div>

            <!-- Written Review (Optional) -->
            <div class="form-group">
                <label for="written-review">Written Review <small>(Optional)</small></label>
                <textarea id="written-review" name="writtenReview" rows="5"></textarea>
            </div>

            <!-- User Name (Optional) -->
            <div class="form-group">
                <label for="user-name">Your Name <small>(Optional)</small></label>
                <input type="text" id="user-name" name="userName">
            </div>

            <!-- Submit Button -->
            <input type="submit" value="Post Review" class="submit-btn">
        </form>
    </main>

    <footer>
        <p>&copy;2026 Sara Araujo</p>
        <p>Czech Republic</p>
        <p>Last Modification: <span id="last-mod"></span></p>
    </footer>

</body>
</html>
