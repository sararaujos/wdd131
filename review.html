<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Confirmation - Thank You</title>
    <meta name="description" content="Thank you for submitting your feedback. Your product review has been successfully recorded and added to our local submission counter.">
    <meta name="author" content="Sara Araujo">
    
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>

    <header>
        <h1>Thank You!</h1>
    </header>

    <main style="text-align: center;">
        <h2>Review Submitted Successfully</h2>
        <p>We appreciate your feedback helping us improve our products.</p>
        <div style="border-top: 1px solid var(--border-color); margin: 20px 0;"></div>
        <p>Total reviews submitted from this browser: <strong id="counter-display">0</strong></p>
        <p style="margin-top: 30px;"><a href="form.html" style="color: var(--turquoise-dark); font-weight: bold;">Submit Another Review</a></p>
    </main>

    <footer>
        <p>&copy;2026 Sara Araujo</p>
        <p>Czech Republic</p>
        <p>Last Modification: <span id="last-mod"></span></p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Lógica del contador de LocalStorage
            let reviewCount = parseInt(localStorage.getItem("reviewCount")) || 0;
            reviewCount++;
            localStorage.setItem("reviewCount", reviewCount);
            document.getElementById("counter-display").textContent = reviewCount;

            // Fecha dinámica para el pie de página
            const lastModElement = document.getElementById("last-mod");
            const currentDateTime = new Date().toLocaleString();
            lastModElement.textContent = currentDateTime;
        });
    </script>
</body>
</html>
