<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get">
            
            <!-- Product Name Dropdown -->
            <div class="form-group">
                <label for="product-name">Product Name</label>
                <select id="product-name" name="productName" required>
                    <option value="" disabled selected>Choose a Product ...</option>
                </select>
            </div>

            <!-- Overall Rating Radio Buttons -->
            <div class="form-group">
                <span class="label-heading">Overall Rating</span>
                <div class="radio-group">
                    <label class="radio-label">
                        <span class="stars">&star;</span>
                        <input type="radio" id="rating-1" name="rating" value="1" required>
                    </label>
                    <label class="radio-label">
                        <span class="stars">&star;&star;</span>
                        <input type="radio" id="rating-2" name="rating" value="2" required>
                    </label>
                    <label class="radio-label">
                        <span class="stars">&star;&star;&star;</span>
                        <input type="radio" id="rating-3" name="rating" value="3" required>
                    </label>
                    <label class="radio-label">
                        <span class="stars">&star;&star;&star;&star;</span>
                        <input type="radio" id="rating-4" name="rating" value="4" required>
                    </label>
                    <label class="radio-label">
                        <span class="stars">&star;&star;&star;&star;&star;</span>
                        <input type="radio" id="rating-5" name="rating" value="5" required>
                    </label>
                </div>
            </div>

            <!-- Date of Installation -->
            <div class="form-group">
                <label for="installation-date">Date of Installation</label>
                <input type="date" id="installation-date" name="installationDate" required>
            </div>

            <!-- Useful Features Checkboxes -->
            <div class="form-group">
                <span class="label-heading">Which features did you find useful in the product? <br><small>(Check all that apply)</small></span>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="feature-durability" name="features" value="durability"> Durability</label>
                    <label><input type="checkbox" id="feature-ease" name="features" value="ease-of-use"> Ease of Use</label>
                    <label><input type="checkbox" id="feature-performance" name="features" value="performance"> Performance</label>
                    <label><input type="checkbox" id="feature-design" name="features" value="design"> Design</label>
                </div>
            </div>

            <!-- Written Review (Optional) -->
            <div class="form-group">
                <label for="written-review">Written Review <small>(Optional)</small></label>
                <textarea id="written-review" name="writtenReview" rows="5"></textarea>
            </div>

            <!-- User Name (Optional) -->
            <div class="form-group">
                <label for="user-name">Your Name <small>(Optional)</small></label>
                <input type="text" id="user-name" name="userName">
            </div>

            <!-- Submit Button -->
            <input type="submit" value="Post Review" class="submit-btn">
        </form>
    </main>

    <footer>
        <p>&copy;2026 Sara Araujo</p>
        <p>República Checa</p>
        <p>Last Modification: <span id="last-mod"></span></p>
    </footer>

</body>
</html>
